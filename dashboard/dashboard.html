<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Home Adm</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/svg+xml" href="./files/svg/aplicativo/icone.svg">

    <script src="../js/api.js" defer></script>

</head>
<body>
    <header class="navbar">
        <a class="logo" href="./inicio.html">
            <img src="./files/svg/fixly.svg" alt="Logo do site fixly">
        </a>

        <nav class="menu">
            <a href="./inicio.html" class="ativo">Início</a>
            <a href="./ordens.html">Ordens</a>
            <a href="./conversas.html">Conversas</a>
        </nav>

        <a class="perfil" href="./perfil.html" aria-label="Perfil">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <circle cx="12" cy="8.5" r="4.2"/>
                <path d="M3.5 22c0-4.7 3.8-7.5 8.5-7.5s8.5 2.8 8.5 7.5z"/>
            </svg>
        </a>
    </header>

    
    <!-- =============== Texto Inicial ===============-->
    <section class="conteudo">
        <h1 class="boasVindas">Bem Vindo, <span>(Gerente, Vendedor)</span></h1> 
        <p class="subtitulo">Consulte o dashboard do Fixly</p>
        
    </section>
    
    <!-- =============== Visão Geral ===============-->
    <div class="divider">
        <span class="title">Visão Geral</span>
    </div>
    
    <section>    
        <div class="totalOs">TOTAL OS</div>
        <div class="Rendimento">Rendimento liquido</div>
        <div class="NovasEntradas">Novas entradas</div>
        <div class="Andamentos">Andamentos</div>
        <div class="Canceladas">Canceladas</div>
        
    </section>
    
    <div class="divider">
     <span class="title">Análise de negócio</span>
    </div>
    
    <!-- =============== GRÁFICOS ===============-->
    <section class="card">

    <h2>Vendas</h2>
    <div class="chips" id="chips"></div>
    <div class="box">
    <canvas id="line" role="img" aria-label="Vendas por dia da semana"></canvas>
    </div>
  </section>
 
  <section class="card orc">
    
    <h2>Orçamentos</h2>
    <div class="nums">
      <div><b style="color:#4a6cf7" id="n1"></b><span>Novos</span></div>
      <div><b style="color:#e0443a" id="n2"></b><span>Negados</span></div>
      <div><b style="color:#43b02a" id="n3"></b><span>Aprovados</span></div>
    </div>
  </section>
 
  <section class="card">
    <h2>Pedidos</h2>
    <div class="pie">
      <div class="box"><canvas id="pie" role="img" aria-label="Pedidos por categoria"></canvas></div>
      <div id="legend"></div>
    </div>
  </section>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="javaScript/dashboard2.js"></script>

    
</body>
</html>
