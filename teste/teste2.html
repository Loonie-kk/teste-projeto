<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dashboard</title>
    <link rel="stylesheet" href="css/style3.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body>

<!-- BARRA DE NAVEGAÇÃO: logo, links e avatar -->
<header class="nav">
  <a class="logo" href="#" aria-label="Fixly">
    <svg width="22" height="28" viewBox="0 0 22 28" aria-hidden="true"><path d="M13 0 2 16h7l-3 12L20 10h-8z" fill="#f5c542"/></svg>
    <span>Fixly</span>
  </a>
  <nav class="links">
    <a href="#" class="ativo">Início</a>
    <a href="#">Ordens</a>
    <a href="#">Conversas</a>
  </nav>
  <button class="avatar" type="button" aria-label="Perfil">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="#1b1b1e" aria-hidden="true"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c0-4.7 3.8-7.5 8.5-7.5s8.5 2.8 8.5 7.5z"/></svg>
  </button>
</header>

<main class="page">
  <h1>Bem vindo, <span id="perfil"></span></h1>
  <p class="sub">Consulte o dashboard do Fixly</p>

  <!-- BUSCA -->
  <div class="busca">
    <input type="search" placeholder="pesquisa" aria-label="Pesquisar">
    <button type="button" aria-label="Buscar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
  </div>

  <!-- VISÃO GERAL: números principais (preenchidos pelo dashboard.js) -->
  <div class="div">Visão Geral</div>
  <section class="visao">
    <div class="col esq">
      <div class="kpi total"><small>Total OS</small><b id="kTotal"></b></div>
      <div class="kpi verde"><small>Rendimento líquido</small><b id="kRend"></b></div>
    </div>
    <div class="col">
      <div class="mini verde"><small>Novas entradas</small><b id="kNovas"></b></div>
      <div class="mini amarelo"><small>Andamento</small><b id="kAnd"></b></div>
      <div class="mini vermelho"><small>Canceladas</small><b id="kCanc"></b></div>
    </div>
  </section>

  <!-- ANÁLISE DE NEGÓCIO: gráficos -->
  <div class="div">Análise de negócio</div>
  <section class="graficos">
    <article class="card largo">
      <div class="topo"><h2>Vendas</h2><div class="chips" id="chips"></div></div>
      <div class="box"><canvas id="line" role="img" aria-label="Vendas por dia da semana"></canvas></div>
    </article>

    <article class="card orc">
      <div class="topo"><h2>Orçamentos</h2></div>
      <div class="nums">
        <div><b style="color:#4a6cf7" id="n1"></b><span>Novos</span></div>
        <div><b style="color:#e0443a" id="n2"></b><span>Negados</span></div>
        <div><b style="color:#43b02a" id="n3"></b><span>Aprovados</span></div>
      </div>
    </article>

    <article class="card">
      <div class="topo"><h2>Pedidos</h2></div>
      <div class="pie">
        <div class="box"><canvas id="pie" role="img" aria-label="Pedidos por categoria"></canvas></div>
        <div id="legend"></div>
      </div>
      <button class="tog" id="tog" type="button">Ver como rosca</button>
    </article>
  </section>

  <!-- Chart.js primeiro, depois o seu script -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="javaScript/dashboard.js"></script>
</main> 

<div class="card-status novas">
  
</div>

</body>
</html>
